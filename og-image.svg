<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="60%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#eff6ff"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 왼쪽 강조 선 -->
  <rect x="0" y="0" width="7" height="630" fill="url(#accentLine)"/>

  <!-- 상단 배지 -->
  <rect x="80" y="68" width="380" height="38" rx="19" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="108" cy="87" r="6" fill="#f59e0b"/>
  <text x="125" y="93" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">경남창원 청씨오모임 · 사장님 정보공유</text>

  <!-- 메인 타이틀 -->
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#1f2937" letter-spacing="-2">경상남도 정책자금 안내</text>

  <!-- 서브 타이틀 -->
  <text x="80" y="258" font-family="Arial, sans-serif" font-size="28" fill="#4b5563">혼자 끙끙대지 마세요 — 사장님 맞춤 정책자금</text>

  <!-- 구분선 -->
  <rect x="80" y="292" width="140" height="5" rx="2.5" fill="#10b981"/>

  <!-- 설명 -->
  <text x="80" y="355" font-family="Arial, sans-serif" font-size="25" fill="#374151">업체 정보만 입력하면 신청 가능한 정책자금을</text>
  <text x="80" y="392" font-family="Arial, sans-serif" font-size="25" fill="#374151">자동으로 찾아드립니다.</text>

  <!-- 특징 칩 3개 -->
  <rect x="80" y="438" width="210" height="46" rx="23" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="185" y="467" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">✅ 공문 직접 검증</text>

  <rect x="306" y="438" width="210" height="46" rx="23" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="411" y="467" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle">📡 실시간 공고 연동</text>

  <rect x="532" y="438" width="210" height="46" rx="23" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="637" y="467" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#713f12" text-anchor="middle">🔒 개인정보 미수집</text>

  <!-- 하단 URL -->
  <text x="80" y="572" font-family="Arial, sans-serif" font-size="20" fill="#9ca3af">amazing-brioche-058e7c.netlify.app</text>

  <!-- 오른쪽 장식 — 따뜻한 원 + 이모지 -->
  <circle cx="1020" cy="310" r="210" fill="#fef3c7" fill-opacity="0.6"/>
  <circle cx="1020" cy="310" r="150" fill="#fde68a" fill-opacity="0.4"/>
  <text x="1020" y="365" font-family="Arial, sans-serif" font-size="130" text-anchor="middle">🤝</text>
</svg>
