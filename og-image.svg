<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0e17"/>
      <stop offset="100%" style="stop-color:#1a1830"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="35%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- 왼쪽 강조 선 -->
  <rect x="0" y="0" width="6" height="630" fill="#6366f1"/>

  <!-- 상단 배지 -->
  <rect x="80" y="72" width="340" height="36" rx="18" fill="#6366f1" fill-opacity="0.25" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="106" cy="90" r="5" fill="#6366f1"/>
  <text x="122" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a5b4fc">경남창원 청씨오모임 · 정책자금 정보</text>

  <!-- 메인 타이틀 -->
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="66" font-weight="900" fill="#ffffff" letter-spacing="-2">경상남도 정책자금 안내</text>

  <!-- 서브 타이틀 -->
  <text x="80" y="262" font-family="Arial, sans-serif" font-size="30" fill="#9ca3af">경상남도 자영업자 · 소상공인 전용</text>

  <!-- 구분선 -->
  <rect x="80" y="295" width="120" height="4" rx="2" fill="#6366f1"/>

  <!-- 설명 -->
  <text x="80" y="358" font-family="Arial, sans-serif" font-size="26" fill="#e2e8f0">업체 정보만 입력하면 신청 가능한 정책자금을</text>
  <text x="80" y="396" font-family="Arial, sans-serif" font-size="26" fill="#e2e8f0">자동으로 찾아드립니다.</text>

  <!-- 특징 칩 3개 -->
  <rect x="80" y="440" width="200" height="44" rx="22" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
  <text x="180" y="468" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#34d399" text-anchor="middle">✅ 공문 직접 검증</text>

  <rect x="296" y="440" width="200" height="44" rx="22" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1"/>
  <text x="396" y="468" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a5b4fc" text-anchor="middle">🔴 실시간 공고 연동</text>

  <rect x="512" y="440" width="200" height="44" rx="22" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1"/>
  <text x="612" y="468" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">🔒 개인정보 미수집</text>

  <!-- 하단 URL -->
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="22" fill="#6b7280">amazing-brioche-058e7c.netlify.app</text>

  <!-- 오른쪽 장식 — 큰 이모지 느낌의 원 -->
  <circle cx="1020" cy="315" r="200" fill="#6366f1" fill-opacity="0.06" stroke="#6366f1" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="1020" cy="315" r="140" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1"/>
  <text x="1020" y="360" font-family="Arial, sans-serif" font-size="120" text-anchor="middle">🍽️</text>
